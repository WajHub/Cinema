# SPRING
spring.application.name=catalog-service
spring.datasource.url=${CATALOG_DB_URL:jdbc:postgresql://localhost:5431/catalog_service}
spring.datasource.username=${CATALOG_DB_USERNAME:postgres}
spring.datasource.password=${CATALOG_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
server.port=8083

# KAFKA & SCHEMA REGISTRY
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVER:localhost:9094}
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# CONSUMER
spring.kafka.consumer.group-id=catalog-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=true

# PRODUCER
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# TOPICS
app.kafka.topics.catalog-events=${CATALOG_EVENTS_TOPIC:dev.cinema.catalog-events.v1}
