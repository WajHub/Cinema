spring.datasource.url=jdbc:tc:postgresql:17-alpine:///catalog_service
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.kafka.properties.schema.registry.url=mock://catalog-test
app.kafka.topics.catalog-events=test.catalog-events
app.outbox.poll-delay-ms=600000
