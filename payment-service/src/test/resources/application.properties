spring.datasource.url=jdbc:tc:postgresql:17-alpine:///payment_service
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.flyway.enabled=false
spring.kafka.properties.schema.registry.url=mock://payment-test
app.kafka.topics.payment-started=test.payment-started
app.kafka.topics.payment-completed=test.payment-completed
app.kafka.topics.payment-cancelled=test.payment-cancelled
app.outbox.poll-delay-ms=600000
app.payment.expiration-poll-delay-ms=600000
app.payment.expiration-minutes=15
