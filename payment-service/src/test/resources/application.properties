spring.datasource.url=jdbc:tc:postgresql:17-alpine:///payment_service
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.flyway.enabled=false
spring.kafka.properties.schema.registry.url=mock://payment-test
app.kafka.topics.payment-started=test.payment-started
app.kafka.topics.payment-completed=test.payment-completed
app.kafka.topics.payment-cancelled=test.payment-cancelled
app.kafka.topics.refund-started=test.refund-started
app.kafka.topics.refund-completed=test.refund-completed
app.outbox.poll-delay-ms=600000
app.payment.expiration-poll-delay-ms=600000
app.payment.expiration-minutes=15

# CONSUMER
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=true

# PRODUCER
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# STRIPE
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.session-expiration-minutes=30
stripe.success-url=http://localhost:8084/api/v1/payments/success?bookingId={BOOKING_ID}
stripe.cancel-url=http://localhost:8084/api/v1/payments/cancel?bookingId={BOOKING_ID}


