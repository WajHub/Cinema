spring.datasource.url=jdbc:tc:postgresql:17-alpine:///booking_service
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.kafka.properties.schema.registry.url=mock://catalog-test
app.kafka.topics.catalog-events=test.catalog-events
app.kafka.topics.payment-started=test.payment-started
app.kafka.topics.payment-completed=test.payment-completed
app.kafka.topics.payment-cancelled=test.payment-cancelled
app.outbox.poll-delay-ms=600000

# CONSUMER
spring.kafka.consumer.group-id=booking-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=true

# PRODUCER
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
