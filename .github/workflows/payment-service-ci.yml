name: Payment Service CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'payment-service/**'
      - '.github/workflows/reusable-ci.yml'
      - '.github/workflows/payment-service.yml'

jobs:
  run-shared-ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      service-name: 'Payment Service'
      service-path: 'payment-service'