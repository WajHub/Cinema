name: Shared CD template

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-path:
        required: true
        type: string


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Login to Azure Container Registry'
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.service-path }}
          push: true
          tags: |
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/cinema-${{ inputs.service-path }}:${{ github.sha }}
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/cinema-${{ inputs.service-path }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure (Start if Stopped, Restart if Running)                                                                                         
        run: |                                                                                                                                               
          # 1. Get the current status of the container group                                                                                                 
          STATE=$(az container show \                                                                                                                        
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \                                                                                           
            --name cinema-payment-service \                                                                                                                  
            --query "instanceView.state" -o tsv)                                                                                                             
                                                                                                                                                            
          echo "Current Container State: $STATE"                                                                                                             
                                                                                                                                                            
          # 2. Start if Stopped/Terminated, or Restart if Running                                                                                            
          if [ "$STATE" == "Running" ]; then                                                                                                                 
            echo "Container is Running. Restarting..."                                                                                                       
            az container restart \                                                                                                                           
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \                                                                                         
              --name cinema-payment-service                                                                                                                  
          else                                                                                                                                               
            echo "Container is not running ($STATE). Starting..."                                                                                            
            az container start \                                                                                                                             
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \                                                                                         
              --name cinema-payment-service                                                                                                                  
          fi 