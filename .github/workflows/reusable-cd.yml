name: Shared CD template

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-path:
        required: true
        type: string


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Build and push image'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker build ./${{ inputs.service-path }} \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/cinema-${{ inputs.service-path }}:${{ github.sha }} \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/cinema-${{ inputs.service-path }}:latest

          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/cinema-${{ inputs.service-path }}:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/cinema-${{ inputs.service-path }}:latest

      - name: Restart ACI to pull new image
        run: |
          az container restart \
            --name cr-cinema-${{ inputs.service-path }}-dev-pl-01 \
            --resource-group rg-cinema-dev-pl