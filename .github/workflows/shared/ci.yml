name: Shared CI template

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-path:
        required: true
        type: string

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: '${{ inputs.service-path }}/pom.xml'

      - name: Build and Test ${{ inputs.service-name }}
        working-directory: ./${{ inputs.service-path }}
        run: ./mvnw clean verify
